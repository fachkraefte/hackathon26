<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" font-family="Rubik, Arial, sans-serif" role="img" aria-label="Übergabe-Karte Mensa am Kanal: wo Informationen zwischen Bereichen verloren gehen">
  <rect width="820" height="590" fill="#F6F8FA"/>
  <defs>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15263E" fill-opacity="0.35"/></marker>
    <marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F08119"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D9480F"/></marker>
  </defs>

  <!-- Lieferant -> Einkauf: läuft -->
  <line x1="140" y1="100" x2="240" y2="100" stroke="#15263E" stroke-opacity="0.35" stroke-width="2" marker-end="url(#mg)"/>
  <!-- Einkauf -> Küche: Zutaten geändert -->
  <line x1="300" y1="152" x2="300" y2="230" stroke="#F08119" stroke-width="5" marker-end="url(#mo)"/>
  <!-- Leitung -> Küche: Mengen -->
  <line x1="490" y1="135" x2="350" y2="248" stroke="#D9480F" stroke-width="8" marker-end="url(#mr)"/>
  <!-- Küche <-> Ausgabe: Nachschub, Allergene -->
  <line x1="352" y1="290" x2="466" y2="290" stroke="#D9480F" stroke-width="8" marker-end="url(#mr)"/>
  <line x1="478" y1="290" x2="364" y2="290" stroke="#D9480F" stroke-width="8" marker-end="url(#mr)"/>
  <!-- Leitung -> Gäste: Speiseplan-App -->
  <line x1="572" y1="135" x2="694" y2="252" stroke="#F08119" stroke-width="3" marker-end="url(#mo)"/>
  <!-- Gäste -> Spülküche: Rückgabe -->
  <line x1="740" y1="340" x2="740" y2="410" stroke="#F08119" stroke-width="5" marker-end="url(#mo)"/>
  <!-- Spülküche -> Ausgabe: Teller fehlen -->
  <line x1="700" y1="440" x2="574" y2="322" stroke="#F08119" stroke-width="3" marker-end="url(#mo)"/>
  <!-- Ausgabe -> Aushilfen: Einarbeitung -->
  <line x1="530" y1="342" x2="530" y2="410" stroke="#D9480F" stroke-width="8" marker-end="url(#mr)"/>
  <!-- Küche intern: Sprache -->
  <path d="M272,330 C230,410 370,410 328,330" fill="none" stroke="#F08119" stroke-width="3" marker-end="url(#mo)"/>

  <g font-size="13" font-weight="500" fill="#15263E" text-anchor="middle">
    <circle cx="90" cy="100" r="48" fill="#FFFFFF" stroke="#15263E" stroke-opacity="0.25" stroke-dasharray="4 3"/>
    <text x="90" y="105">Lieferant</text>
    <circle cx="300" cy="100" r="52" fill="#FFFFFF" stroke="#15263E" stroke-width="2"/>
    <text x="300" y="97">Einkauf</text><text x="300" y="113">und Lager</text>
    <circle cx="530" cy="100" r="50" fill="#FFFFFF" stroke="#15263E" stroke-width="2"/>
    <text x="530" y="105">Leitung</text>
    <circle cx="300" cy="290" r="50" fill="#FFFFFF" stroke="#15263E" stroke-width="2"/>
    <text x="300" y="295">Küche</text>
    <circle cx="530" cy="290" r="52" fill="#FFFFFF" stroke="#15263E" stroke-width="2"/>
    <text x="530" y="287">Ausgabe</text><text x="530" y="303">und Kasse</text>
    <circle cx="740" cy="290" r="48" fill="#FFFFFF" stroke="#15263E" stroke-opacity="0.25" stroke-dasharray="4 3"/>
    <text x="740" y="295">Gäste</text>
    <circle cx="530" cy="460" r="50" fill="#FFFFFF" stroke="#15263E" stroke-width="2"/>
    <text x="530" y="465">Aushilfen</text>
    <circle cx="740" cy="460" r="50" fill="#FFFFFF" stroke="#15263E" stroke-width="2"/>
    <text x="740" y="465">Spülküche</text>
  </g>

  <g font-size="11.5" fill="#15263E">
    <text x="190" y="88" text-anchor="middle" fill-opacity="0.7">Produkttausch</text>
    <text x="290" y="182" text-anchor="end">Zutaten geändert</text>
    <text x="290" y="198" text-anchor="end" fill-opacity="0.7">2 Stimmen</text>
    <text x="458" y="186" font-weight="600">Mengen</text>
    <text x="458" y="202" fill-opacity="0.7">3 Stimmen</text>
    <text x="415" y="270" text-anchor="middle" font-weight="600">Nachschub, Allergene</text>
    <text x="415" y="320" text-anchor="middle" fill-opacity="0.7">3 Stimmen</text>
    <text x="640" y="170">Speiseplan-App</text>
    <text x="640" y="186" fill-opacity="0.7">1 Stimme</text>
    <text x="752" y="372">Rückgabe</text>
    <text x="752" y="388" fill-opacity="0.7">2 Stimmen</text>
    <text x="628" y="408" text-anchor="end">Teller fehlen</text>
    <text x="628" y="424" text-anchor="end" fill-opacity="0.7">1 Stimme</text>
    <text x="518" y="372" text-anchor="end" font-weight="600">Einarbeitung</text>
    <text x="518" y="388" text-anchor="end" fill-opacity="0.7">3 Stimmen</text>
    <text x="300" y="425" text-anchor="middle">Sprache · 1 Stimme</text>
  </g>

  <g font-size="11.5" fill="#15263E" transform="translate(40,550)">
    <line x1="0" y1="6" x2="26" y2="6" stroke="#15263E" stroke-opacity="0.35" stroke-width="2"/>
    <text x="34" y="10">läuft</text>
    <line x1="90" y1="6" x2="116" y2="6" stroke="#F08119" stroke-width="5"/>
    <text x="124" y="10">Reibung</text>
    <line x1="200" y1="6" x2="226" y2="6" stroke="#D9480F" stroke-width="8"/>
    <text x="234" y="10">Bruchstelle</text>
    <text x="330" y="10" fill-opacity="0.7">Linienstärke = Zahl der Stimmen · gezeigt werden Bereiche, keine Personen</text>
  </g>
</svg>
